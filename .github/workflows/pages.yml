name: Publicação manual do Checkpoint
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Confirmo que quero publicar o site no GitHub Pages'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ inputs.publish == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir -p public/data public/assets
          cp index.html styles.css theme.css buttons.css finishes.css awards.css account.css app.js social.js score.js recommender.js favicon.svg .nojekyll public/
          cp data/*.js public/data/
          cp assets/* public/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
